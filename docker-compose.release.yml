x-common-build: &common-build
  context: .
  dockerfile: Dockerfile
  args:
    DOCKER_BUILD_MIRROR: default
    PIP_USE_OFFICIAL: "1"

x-common-volumes: &common-volumes
  - ./config.toml:/MoneyPrinterTurbo/config.toml
  - ./storage:/MoneyPrinterTurbo/storage

x-common-hardening: &common-hardening
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp

services:
  webui:
    <<: *common-hardening
    build: *common-build
    image: moneyprinterturbo:local
    container_name: "moneyprinterturbo-webui"
    ports:
      - "127.0.0.1:8501:8501"
    command: [ "streamlit", "run", "./webui/Main.py", "--server.address=0.0.0.0", "--server.port=8501", "--browser.serverAddress=127.0.0.1", "--server.enableCORS=True", "--browser.gatherUsageStats=False", "--client.toolbarMode=minimal", "--logger.hideWelcomeMessage=True", "--server.showEmailPrompt=False" ]
    volumes: *common-volumes
    restart: always
  api:
    <<: *common-hardening
    build: *common-build
    image: moneyprinterturbo:local
    container_name: "moneyprinterturbo-api"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Set MPT_API_KEY explicitly for managed deployments. Fresh local Compose
      # installs leave it empty and main.py atomically creates a persistent
      # random key at ./storage/.mpt_api_key (mode 0600 where supported).
      MPT_API_KEY: ${MPT_API_KEY:-}
      MPT_API_KEY_FILE: /MoneyPrinterTurbo/storage/.mpt_api_key
      # Containers must listen on their interface; host publishing remains
      # loopback-only and every privileged route requires X-API-Key.
      MPT_LISTEN_HOST: 0.0.0.0
    command: [ "python3", "main.py" ]
    volumes: *common-volumes
    restart: always
